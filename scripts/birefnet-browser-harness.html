<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BiRefNet browser harness</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      const params = new URLSearchParams(location.search)
      const ortUrl = params.get('ort')
      const wasmPaths = params.get('wasmPaths') || '/ort-vendor/'
      const modelUrl = params.get('model')
      const fixturePath = params.get('fixture')
      const methodId = params.get('method') || 'birefnet-lite-512'
      const requestedEp = (params.get('ep') || 'wasm').toLowerCase()
      const out = document.getElementById('out')

      function report(obj) {
        window.__BIREFNET_VERIFY__ = obj
        out.textContent = JSON.stringify(obj, null, 2)
      }

      try {
        if (!ortUrl || !modelUrl || !fixturePath) {
          throw new Error('missing ort/model/fixture query params')
        }
        const ort = await import(ortUrl)
        if (ort.env?.wasm) {
          ort.env.wasm.wasmPaths = wasmPaths
          ort.env.wasm.numThreads = 1
        }
        const blob = await (await fetch(fixturePath)).blob()
        const bmp = await createImageBitmap(blob)
        const canvas = document.createElement('canvas')
        canvas.width = bmp.width
        canvas.height = bmp.height
        const ctx = canvas.getContext('2d')
        ctx.drawImage(bmp, 0, 0)
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height)

        const SIZE = 512
        const MEAN = [0.485, 0.456, 0.406]
        const STD = [0.229, 0.224, 0.225]
        const tensor = new Float32Array(1 * 3 * SIZE * SIZE)
        const srcW = imageData.width
        const srcH = imageData.height
        const data = imageData.data
        const sample = (x, y, c) => {
          const x0 = Math.floor(x)
          const y0 = Math.floor(y)
          const x1 = Math.min(srcW - 1, x0 + 1)
          const y1 = Math.min(srcH - 1, y0 + 1)
          const fx = x - x0
          const fy = y - y0
          const at = (xx, yy) => data[(yy * srcW + xx) * 4 + c]
          return (
            at(x0, y0) * (1 - fx) * (1 - fy) +
            at(x1, y0) * fx * (1 - fy) +
            at(x0, y1) * (1 - fx) * fy +
            at(x1, y1) * fx * fy
          )
        }
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            const sx = Math.min(
              srcW - 1,
              Math.max(0, (x + 0.5) * (srcW / SIZE) - 0.5),
            )
            const sy = Math.min(
              srcH - 1,
              Math.max(0, (y + 0.5) * (srcH / SIZE) - 0.5),
            )
            for (let c = 0; c < 3; c++) {
              tensor[c * SIZE * SIZE + y * SIZE + x] =
                (sample(sx, sy, c) / 255 - MEAN[c]) / STD[c]
            }
          }
        }

        const hasGpu = typeof navigator !== 'undefined' && 'gpu' in navigator
        let webgpuError = null
        let epFallback = null

        async function createOn(device) {
          return ort.InferenceSession.create(modelUrl, {
            executionProviders: device === 'webgpu' ? ['webgpu', 'wasm'] : ['wasm'],
            graphOptimizationLevel: 'all',
          })
        }

        function scoreLogits(logits) {
          let rawMin = Infinity
          let rawMax = -Infinity
          let nonFinite = 0
          for (let i = 0; i < logits.length; i++) {
            const v = logits[i]
            if (!Number.isFinite(v)) {
              nonFinite++
              continue
            }
            if (v < rawMin) rawMin = v
            if (v > rawMax) rawMax = v
          }
          const alreadyProb = rawMax <= 1.5 && rawMin >= -0.05
          const degenerate = nonFinite > 0 || (rawMax <= 0 && rawMin < -0.5) || rawMax - rawMin < 0.05
          let keep = 0
          let soft = 0
          const alpha = new Float32Array(SIZE * SIZE)
          const n = Math.min(SIZE * SIZE, logits.length)
          for (let i = 0; i < n; i++) {
            let v = logits[i]
            if (!Number.isFinite(v)) v = 0
            const p = alreadyProb
              ? Math.min(1, Math.max(0, v))
              : 1 / (1 + Math.exp(-Math.min(50, Math.max(-50, v))))
            alpha[i] = p
            const a = Math.round(p * 255)
            if (a >= 128) keep++
            else if (a > 0) soft++
          }
          let center = 0
          let border = 0
          let centerN = 0
          let borderN = 0
          for (let y = 0; y < SIZE; y++) {
            for (let x = 0; x < SIZE; x++) {
              const p = alpha[y * SIZE + x]
              const edge = x < 8 || y < 8 || x >= SIZE - 8 || y >= SIZE - 8
              if (edge) {
                border += p
                borderN++
              }
              if (
                x > SIZE * 0.35 &&
                x < SIZE * 0.65 &&
                y > SIZE * 0.35 &&
                y < SIZE * 0.65
              ) {
                center += p
                centerN++
              }
            }
          }
          return {
            rawMin,
            rawMax,
            alreadyProb,
            degenerate,
            nonFinite,
            keep,
            soft,
            centerMean: center / centerN,
            borderMean: border / borderN,
          }
        }

        let device = 'wasm'
        if (requestedEp === 'webgpu') {
          if (!hasGpu) {
            throw new Error('ep=webgpu requested but navigator.gpu is missing')
          }
          device = 'webgpu'
        } else if (requestedEp !== 'wasm') {
          throw new Error(`unsupported ep=${requestedEp}`)
        }

        const cold0 = performance.now()
        let session
        try {
          session = await createOn(device)
        } catch (err) {
          if (device === 'webgpu') {
            webgpuError = err instanceof Error ? err.message : String(err)
            throw new Error(`WebGPU session create failed: ${webgpuError}`)
          }
          throw err
        }
        const coldMs = performance.now() - cold0

        const inputName = session.inputNames.includes('input_image')
          ? 'input_image'
          : session.inputNames[0]
        const outputName = session.outputNames.includes('output_image')
          ? 'output_image'
          : session.outputNames[0]

        const feeds = {
          [inputName]: new ort.Tensor('float32', tensor, [1, 3, SIZE, SIZE]),
        }
        const t0 = performance.now()
        const out1 = await session.run(feeds)
        const warm1 = performance.now() - t0
        const outTensor = out1[outputName]
        const logits = outTensor.data
        const dims = Array.from(outTensor.dims || [])
        const scored = scoreLogits(logits)

        const t1 = performance.now()
        await session.run({
          [inputName]: new ort.Tensor('float32', tensor, [1, 3, SIZE, SIZE]),
        })
        const warm2 = performance.now() - t1
        if (typeof session.release === 'function') await session.release()

        report({
          ok: true,
          methodId,
          device,
          requestedEp,
          hasGpu,
          webgpuError,
          epFallback,
          degenerate: scored.degenerate,
          coldMs: Math.round(coldMs),
          warm1Ms: Math.round(warm1),
          warm2Ms: Math.round(warm2),
          keepRatio: +(scored.keep / (SIZE * SIZE)).toFixed(4),
          softRatio: +(scored.soft / (SIZE * SIZE)).toFixed(4),
          nonFinite: scored.nonFinite,
          rawMin: +scored.rawMin.toFixed(6),
          rawMax: +scored.rawMax.toFixed(6),
          alreadyProb: scored.alreadyProb,
          dims,
          logitsLen: logits.length,
          centerMean: +scored.centerMean.toFixed(4),
          borderMean: +scored.borderMean.toFixed(4),
          polarityLikelyCorrect: scored.centerMean > scored.borderMean + 0.02,
          meaningfulKeep: scored.keep / (SIZE * SIZE) > 0.02,
          inputName,
          outputName,
          notSilentRmbg: methodId === 'birefnet-lite-512',
          sourceSize: { w: srcW, h: srcH },
        })
      } catch (err) {
        report({
          ok: false,
          error: err instanceof Error ? err.message : String(err),
        })
      }
    </script>
  </body>
</html>
