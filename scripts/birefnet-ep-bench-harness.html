<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BiRefNet isolated EP bench (experimental)</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      /**
       * Isolated harness — not used by production App.
       * Query: ort, wasmPaths, model, fixtures (comma paths), ep=wasm|webgpu|webgl, method
       */
      const params = new URLSearchParams(location.search)
      const ortUrl = params.get('ort')
      const wasmPaths = params.get('wasmPaths') || '/ort-vendor/'
      const modelUrl = params.get('model')
      const fixturesCsv = params.get('fixtures') || ''
      const methodId = params.get('method') || 'birefnet-lite-512'
      const requestedEp = (params.get('ep') || 'wasm').toLowerCase()
      const out = document.getElementById('out')

      function report(obj) {
        window.__BIREFNET_EP_BENCH__ = obj
        out.textContent = JSON.stringify(obj, null, 2)
      }

      function mem() {
        const m = performance.memory
        if (!m) return null
        return {
          usedJSHeapMb: +(m.usedJSHeapSize / 1e6).toFixed(2),
          totalJSHeapMb: +(m.totalJSHeapSize / 1e6).toFixed(2),
          jsHeapLimitMb: +(m.jsHeapSizeLimit / 1e6).toFixed(2),
        }
      }

      const SIZE = 512
      const MEAN = [0.485, 0.456, 0.406]
      const STD = [0.229, 0.224, 0.225]

      async function decode(path) {
        const blob = await (await fetch(path)).blob()
        const bmp = await createImageBitmap(blob)
        const canvas = document.createElement('canvas')
        canvas.width = bmp.width
        canvas.height = bmp.height
        const ctx = canvas.getContext('2d')
        ctx.drawImage(bmp, 0, 0)
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height)
        bmp.close?.()
        return imageData
      }

      function preprocess(imageData) {
        const tensor = new Float32Array(1 * 3 * SIZE * SIZE)
        const srcW = imageData.width
        const srcH = imageData.height
        const data = imageData.data
        const sample = (x, y, c) => {
          const x0 = Math.floor(x)
          const y0 = Math.floor(y)
          const x1 = Math.min(srcW - 1, x0 + 1)
          const y1 = Math.min(srcH - 1, y0 + 1)
          const fx = x - x0
          const fy = y - y0
          const at = (xx, yy) => data[(yy * srcW + xx) * 4 + c]
          return (
            at(x0, y0) * (1 - fx) * (1 - fy) +
            at(x1, y0) * fx * (1 - fy) +
            at(x0, y1) * (1 - fx) * fy +
            at(x1, y1) * fx * fy
          )
        }
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            const sx = Math.min(
              srcW - 1,
              Math.max(0, (x + 0.5) * (srcW / SIZE) - 0.5),
            )
            const sy = Math.min(
              srcH - 1,
              Math.max(0, (y + 0.5) * (srcH / SIZE) - 0.5),
            )
            for (let c = 0; c < 3; c++) {
              tensor[c * SIZE * SIZE + y * SIZE + x] =
                (sample(sx, sy, c) / 255 - MEAN[c]) / STD[c]
            }
          }
        }
        return tensor
      }

      function scoreLogits(logits) {
        let rawMin = Infinity
        let rawMax = -Infinity
        let nonFinite = 0
        let keep = 0
        let soft = 0
        const alpha = new Float32Array(SIZE * SIZE)
        const n = Math.min(SIZE * SIZE, logits.length)
        for (let i = 0; i < n; i++) {
          let v = logits[i]
          if (!Number.isFinite(v)) {
            nonFinite++
            v = 0
          }
          if (v < rawMin) rawMin = v
          if (v > rawMax) rawMax = v
          const p = 1 / (1 + Math.exp(-Math.min(50, Math.max(-50, v))))
          alpha[i] = p
          const a = Math.round(p * 255)
          if (a >= 128) keep++
          else if (a > 0) soft++
        }
        const degenerate =
          nonFinite > 0 ||
          (rawMax <= 0 && rawMin < -0.5) ||
          rawMax - rawMin < 0.05
        let center = 0
        let border = 0
        let centerN = 0
        let borderN = 0
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            const p = alpha[y * SIZE + x]
            const edge = x < 8 || y < 8 || x >= SIZE - 8 || y >= SIZE - 8
            if (edge) {
              border += p
              borderN++
            }
            if (
              x > SIZE * 0.35 &&
              x < SIZE * 0.65 &&
              y > SIZE * 0.35 &&
              y < SIZE * 0.65
            ) {
              center += p
              centerN++
            }
          }
        }
        // Sample for SHA-ish fingerprint without shipping full logits
        let fingerprint = 0
        for (let i = 0; i < n; i += 1024) {
          fingerprint = (fingerprint * 31 + (logits[i] * 1000) | 0) | 0
        }
        return {
          rawMin,
          rawMax,
          nonFinite,
          degenerate,
          keep,
          soft,
          centerMean: center / Math.max(1, centerN),
          borderMean: border / Math.max(1, borderN),
          fingerprint,
          alphaSample: Array.from(alpha.subarray(0, 16)),
        }
      }

      try {
        if (!ortUrl || !modelUrl || !fixturesCsv) {
          throw new Error('missing ort/model/fixtures query params')
        }
        const fixturePaths = fixturesCsv.split(',').filter(Boolean)
        const hasGpu = typeof navigator !== 'undefined' && 'gpu' in navigator

        // Load EP-appropriate ORT bundle
        let ortEntry = ortUrl
        if (requestedEp === 'webgpu') {
          ortEntry = '/ort-vendor/ort.webgpu.min.mjs'
        } else if (requestedEp === 'webgl') {
          ortEntry = '/ort-vendor/ort.webgl.min.mjs'
        }

        const ort = await import(ortEntry)
        if (ort.env?.wasm) {
          ort.env.wasm.wasmPaths = wasmPaths
          ort.env.wasm.numThreads = 1
        }

        let device = 'wasm'
        let providers = ['wasm']
        if (requestedEp === 'webgpu') {
          if (!hasGpu) throw new Error('ep=webgpu but navigator.gpu missing')
          device = 'webgpu'
          providers = ['webgpu']
        } else if (requestedEp === 'webgl') {
          device = 'webgl'
          providers = ['webgl']
        } else if (requestedEp !== 'wasm') {
          throw new Error(`unsupported ep=${requestedEp}`)
        }

        const mem0 = mem()
        const cold0 = performance.now()
        let session
        let createError = null
        try {
          session = await ort.InferenceSession.create(modelUrl, {
            executionProviders: providers,
            graphOptimizationLevel: 'all',
          })
        } catch (err) {
          createError = err instanceof Error ? err.message : String(err)
          report({
            ok: false,
            phase: 'session-create',
            requestedEp,
            device,
            hasGpu,
            createError,
            memory: { before: mem0, after: mem() },
          })
          throw err
        }
        const coldMs = performance.now() - cold0
        const memAfterInit = mem()

        const inputName = session.inputNames.includes('input_image')
          ? 'input_image'
          : session.inputNames[0]
        const outputName = session.outputNames.includes('output_image')
          ? 'output_image'
          : session.outputNames[0]

        const results = []
        let peakHeap = memAfterInit?.usedJSHeapMb ?? 0
        let firstLogitsScore = null

        for (let i = 0; i < fixturePaths.length; i++) {
          const path = fixturePaths[i]
          const imageData = await decode(path)
          const tensor = preprocess(imageData)
          const feeds = {
            [inputName]: new ort.Tensor('float32', tensor, [1, 3, SIZE, SIZE]),
          }
          const t0 = performance.now()
          const out = await session.run(feeds)
          const inferMs = performance.now() - t0
          const logits = out[outputName].data
          const scored = scoreLogits(logits)
          if (i === 0) firstLogitsScore = scored
          const m = mem()
          if (m) peakHeap = Math.max(peakHeap, m.usedJSHeapMb)
          results.push({
            path,
            inferMs: Math.round(inferMs),
            keepRatio: +(scored.keep / (SIZE * SIZE)).toFixed(4),
            softRatio: +(scored.soft / (SIZE * SIZE)).toFixed(4),
            degenerate: scored.degenerate,
            rawMin: +scored.rawMin.toFixed(6),
            rawMax: +scored.rawMax.toFixed(6),
            nonFinite: scored.nonFinite,
            centerMean: +scored.centerMean.toFixed(4),
            borderMean: +scored.borderMean.toFixed(4),
            fingerprint: scored.fingerprint,
            dims: [imageData.width, imageData.height],
            heapUsedMb: m?.usedJSHeapMb ?? null,
          })
        }

        // Extra warm on first fixture
        const first = fixturePaths[0]
        const imageData = await decode(first)
        const tensor = preprocess(imageData)
        const tWarm = performance.now()
        await session.run({
          [inputName]: new ort.Tensor('float32', tensor, [1, 3, SIZE, SIZE]),
        })
        const warmReuseMs = Math.round(performance.now() - tWarm)

        if (typeof session.release === 'function') await session.release()

        report({
          ok: true,
          experimental: true,
          methodId,
          requestedEp,
          device,
          ortEntry,
          hasGpu,
          createError,
          coldMs: Math.round(coldMs),
          warmReuseMs,
          sequentialBatch: results,
          sequentialBatchTotalMs: results.reduce((a, r) => a + r.inferMs, 0),
          firstFixtureLogits: firstLogitsScore
            ? {
                degenerate: firstLogitsScore.degenerate,
                rawMin: firstLogitsScore.rawMin,
                rawMax: firstLogitsScore.rawMax,
                fingerprint: firstLogitsScore.fingerprint,
                alphaSample: firstLogitsScore.alphaSample,
                keepRatio: +(
                  firstLogitsScore.keep /
                  (SIZE * SIZE)
                ).toFixed(4),
              }
            : null,
          meaningfulKeep: results.every((r) => r.keepRatio > 0.02 && !r.degenerate),
          memory: {
            available: Boolean(mem0),
            beforeMb: mem0,
            afterInitMb: memAfterInit,
            peakUsedJSHeapMb: peakHeap,
            endMb: mem(),
          },
          notSilentRmbg: methodId === 'birefnet-lite-512',
        })
      } catch (err) {
        if (!window.__BIREFNET_EP_BENCH__) {
          report({
            ok: false,
            error: err instanceof Error ? err.message : String(err),
          })
        }
      }
    </script>
  </body>
</html>
